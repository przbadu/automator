[project]
name = "backend"
version = "0.1.0"
description = "RAG app backend — FastAPI + ChromaDB + Docling"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "anthropic>=0.84.0",
    "bcrypt>=5.0.0",
    "chromadb>=1.5.5",
    "cryptography>=46.0.5",
    "docling>=2.79.0",
    "fastapi[standard]>=0.135.1",
    "httpx>=0.28.1",
    "langfuse>=4.0.0",
    "openai>=2.26.0",
    "opencv-python-headless>=4.13.0.92",
    "pydantic-settings>=2.13.1",
    "pydantic[email]>=2.12.5",
    "pyjwt>=2.12.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.22",
    "rank-bm25>=0.2.2",
    "sse-starlette>=3.3.2",
    "tiktoken>=0.12.0",
    "uvicorn[standard]>=0.41.0",
]

[tool.uv]
# Use CPU-only PyTorch to avoid pulling ~4GB of NVIDIA CUDA packages.
# Remove this section if running on a machine with an NVIDIA GPU.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
